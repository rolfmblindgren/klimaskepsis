<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f2421"/>
  <!-- Arctic ice cap shape -->
  <ellipse cx="32" cy="20" rx="18" ry="10" fill="#6de9dc" opacity="0.9"/>
  <ellipse cx="32" cy="20" rx="12" ry="6" fill="#dffeec"/>
  <!-- Downward trend line -->
  <polyline points="10,38 20,36 30,40 40,34 54,44"
            stroke="#6de9dc" stroke-width="3" fill="none"
